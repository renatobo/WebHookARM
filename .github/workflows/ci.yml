name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    name: Lint and Metadata Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.2"
          coverage: none

      - name: PHP syntax lint
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Check version consistency
        run: |
          PLUGIN_VERSION=$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' webhookarm.php | head -n 1 | tr -d '\r')
          STABLE_TAG=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -n 1 | tr -d '\r')

          if [ -z "$PLUGIN_VERSION" ] || [ -z "$STABLE_TAG" ]; then
            echo "Could not extract plugin version or stable tag."
            exit 1
          fi

          if [ "$PLUGIN_VERSION" != "$STABLE_TAG" ]; then
            echo "Version mismatch: webhookarm.php Version=$PLUGIN_VERSION, readme.txt Stable tag=$STABLE_TAG"
            exit 1
          fi

      - name: Check tested-up-to consistency
        run: |
          PLUGIN_TESTED=$(sed -n 's/^[[:space:]]*\*[[:space:]]*Tested up to:[[:space:]]*//p' webhookarm.php | head -n 1 | tr -d '\r')
          README_TESTED=$(sed -n 's/^Tested up to:[[:space:]]*//p' readme.txt | head -n 1 | tr -d '\r')

          if [ -z "$PLUGIN_TESTED" ] || [ -z "$README_TESTED" ]; then
            echo "Could not extract Tested up to values."
            exit 1
          fi

          if [ "$PLUGIN_TESTED" != "$README_TESTED" ]; then
            echo "Tested up to mismatch: webhookarm.php=$PLUGIN_TESTED, readme.txt=$README_TESTED"
            exit 1
          fi
