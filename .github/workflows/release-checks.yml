name: Release checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for release
        required: false
        type: string
        default: ''
    outputs:
      artifact_id:
        description: Exact CI-validated package artifact
        value: ${{ jobs.package.outputs.artifact_id }}

permissions:
  contents: read

jobs:
  package:
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.2'
          coverage: none
      - name: Test release guards
        run: python3 -B -m unittest discover -s .github/tests -v
      - name: Validate version metadata
        run: python3 -B .github/scripts/release.py version
      - name: Validate release notes for opted-in PRs
        if: inputs.ref != '' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release'))
        run: python3 -B .github/scripts/release.py metadata
      - name: Build installable package
        run: bash build.sh
      - name: Inspect package and record commit/checksum
        id: package
        run: python3 -B .github/scripts/release.py package
      - name: Upload verified package
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package-${{ github.run_attempt }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 7
